<style>
:root{
  --font:"Paperlogy",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  --font-head:var(--font);
  --orb1:#FFC9A0;--orb2:var(--primary);
}
/* ---------- 테마 ---------- */
html[data-theme="aurora"]{
  --bg:#EAE8EE;--surface:rgba(255,255,255,.58);--surface2:rgba(255,255,255,.66);--surface-solid:rgba(251,250,253,.95);
  --text:#1F1B26;--text2:#4D4757;--text3:#8E889A;--border:rgba(31,27,38,.08);
  --primary:#EC6F5A;--primary-hover:#DB5A45;--on-primary:#FFFFFF;--soft:rgba(236,111,90,.12);--soft-text:#C24E3A;
  --deadline:#E5484D;--deadline-soft:rgba(229,72,77,.12);--event:#7A5AF0;--event-soft:rgba(122,90,240,.12);--etc:#8E889A;--etc-soft:rgba(142,136,154,.14);
  --radius:24px;--radius-sm:16px;--btn-radius:999px;--shadow:0 8px 30px rgba(84,60,120,.08);
  --header-bg:rgba(255,255,255,.52);--header-text:#1F1B26;--header-sub:#8E889A;--header-border:rgba(255,255,255,.85);
  --tab-text:#4D4757;--tab-active-bg:rgba(255,255,255,.96);--tab-active-text:#1F1B26;--tab-radius:14px;--tab-active-shadow:0 4px 16px rgba(84,60,120,.10);
  --mark:rgba(255,196,140,.6);--ok:#3BAF84;--orb1:#FFB98C;--orb2:#EF5A7E;
}
html[data-theme="aurora"] body{background:
  radial-gradient(70vw 58vh at -8% 106%, rgba(250,186,156,.9), transparent 70%),
  radial-gradient(62vw 62vh at 106% 106%, rgba(188,162,246,.88), transparent 70%),
  radial-gradient(46vw 42vh at 52% 104%, rgba(247,178,206,.62), transparent 70%),
  radial-gradient(60vw 52vh at 100% -12%, rgba(255,255,255,.95), transparent 70%),
  #EAE8EE;background-attachment:fixed}
html[data-theme="aurora"] :is(.side,.card,.stat,.task,.cand,.srcitem,.search-pill,.seg,.cell,.sticky-bar,.status,.kv div,.th,.drop,.steps li,.banner){-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
html[data-theme="aurora"] :is(.card,.task,.cand,.srcitem,.th){border:1px solid rgba(255,255,255,.8)!important}
html[data-theme="aurora"] .card{box-shadow:0 10px 40px rgba(84,60,120,.07)}
html[data-theme="aurora"] .inp{background:rgba(255,255,255,.72);border-color:rgba(31,27,38,.07)}
html[data-theme="aurora"] .inp:focus{background:#fff;box-shadow:0 0 0 4px rgba(236,111,90,.14)}
html[data-theme="aurora"] :is(.btn.pri,.fab,.steps b){background:linear-gradient(135deg,#F7A374,#EC5F72);color:#fff}
html[data-theme="aurora"] .btn.pri:hover{background:linear-gradient(135deg,#F39563,#E24E64)}
html[data-theme="aurora"] .btn:not(.pri):not(.danger):not(.danger-line){background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.9)}
html[data-theme="aurora"] .btn.line{border-color:rgba(31,27,38,.08)}
html[data-theme="aurora"] .seg{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.8)}
html[data-theme="aurora"] .seg-ind{box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(84,60,120,.12)}
html[data-theme="aurora"] .cell{background:rgba(255,255,255,.42)}
html[data-theme="aurora"] .cell.sel{background:rgba(255,255,255,.85)}
html[data-theme="aurora"] .card.preview{border:2px solid rgba(255,255,255,.95)!important;box-shadow:0 0 0 4px rgba(236,111,90,.18),0 10px 40px rgba(84,60,120,.08)}
html[data-theme="aurora"] .card.fresh{border:2px solid rgba(255,255,255,.95)!important;background:linear-gradient(180deg,rgba(255,236,226,.75),rgba(255,255,255,.5) 110px)}
html[data-theme="aurora"] .page-title{font-weight:700}
/* ---------- 글라스 요소 (파스텔 글래스) ---------- */
html[data-theme="aurora"]{
  --glass:linear-gradient(135deg,rgba(255,255,255,.68),rgba(255,255,255,.34));
  --glass-strong:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.58));
  --glass-line:rgba(255,255,255,.78);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.22);
  --glass-shadow:0 8px 28px rgba(84,60,120,.08);
  --seg-on-bg:rgba(255,255,255,.95);
}
html[data-theme="aurora"] :is(.card,.task,.cand,.srcitem,.status,.kv div,.th,.steps li,.drop,.t-memo,.sent,.count-box,.radio,.side-foot,.search-pill,.seg,.cell,.banner){background:var(--glass);border-color:var(--glass-line);box-shadow:var(--glass-hl),var(--glass-shadow)}
html[data-theme="aurora"] :is(.task,.cand,.srcitem,.status,.kv div,.t-memo,.sent,.count-box,.radio,.cell){-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
html[data-theme="aurora"] :is(.sent,.t-memo,.count-box){border:1px solid var(--glass-line)}
html[data-theme="aurora"] .side{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.30));box-shadow:var(--glass-hl),0 16px 50px rgba(84,60,120,.10)}
html[data-theme="aurora"] .status.err{background:linear-gradient(135deg,rgba(255,226,228,.8),rgba(255,236,238,.45));color:var(--deadline)}
html[data-theme="aurora"] :is(.drop:hover,.drop.over){background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,236,226,.6));border-color:rgba(236,111,90,.45)}
html[data-theme="aurora"] .banner{color:var(--soft-text)}
html[data-theme="aurora"] .banner.warn{background:linear-gradient(135deg,rgba(255,226,228,.85),rgba(255,236,238,.5));color:var(--deadline)}
/* 버튼 */
html[data-theme="aurora"] .btn:not(.pri):not(.danger){background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hl),0 4px 14px rgba(84,60,120,.07);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
html[data-theme="aurora"] .btn:not(.pri):not(.danger):hover{background:var(--glass-strong);filter:none}
html[data-theme="aurora"] .btn.danger-line{color:var(--deadline)}
html[data-theme="aurora"] :is(.btn.pri,.fab){border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px rgba(236,95,114,.30)}
html[data-theme="aurora"] .btn.danger{background:linear-gradient(135deg,#F07A7E,#E0434E);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px rgba(224,67,78,.28)}
html[data-theme="aurora"] .btn:disabled{opacity:.5}
/* 입력칸 */
html[data-theme="aurora"] .inp{background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.48));border:1px solid var(--glass-line);box-shadow:inset 0 1px 2px rgba(84,60,120,.06),inset 0 -1px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
html[data-theme="aurora"] .inp:focus{background:rgba(255,255,255,.92);border-color:rgba(236,111,90,.5);box-shadow:0 0 0 4px rgba(236,111,90,.14),inset 0 1px 2px rgba(84,60,120,.05)}
/* 작은 요소 */
html[data-theme="aurora"] :is(.badge,.chip,.tag,.fmt span,kbd){border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
html[data-theme="aurora"] :is(.tag,.fmt span,kbd){background:rgba(255,255,255,.55)}
html[data-theme="aurora"] .badge.new{background:linear-gradient(135deg,#F7A374,#EC5F72);color:#fff}
html[data-theme="aurora"] .chk{background:rgba(255,255,255,.6);border:1.5px solid rgba(31,27,38,.14);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(84,60,120,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html[data-theme="aurora"] .task.done .chk{background:linear-gradient(135deg,#7FD7AE,#3BAF84);border-color:rgba(255,255,255,.7)}
html[data-theme="aurora"] .icon-btn:hover{background:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 #fff}
html[data-theme="aurora"] .cmdk-it .ic{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85)}
html[data-theme="aurora"] .cmdk-it.on{background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,236,228,.7));box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(84,60,120,.08)}
/* 창 */
html[data-theme="aurora"] :is(.modal,.pop){background:linear-gradient(150deg,rgba(255,255,255,.86),rgba(255,255,255,.62));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 30px 80px rgba(60,30,90,.22);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
html[data-theme="aurora"] .modal-bg{background:rgba(40,25,60,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html[data-theme="aurora"] .toast{background:rgba(31,27,38,.66);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-radius:18px}
html[data-theme="aurora"] .sticky-bar{background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.42));border-top:1px solid rgba(255,255,255,.85);box-shadow:0 -10px 30px rgba(84,60,120,.08)}
html[data-theme="aurora"] .logo{box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(84,60,120,.12);border:1px solid rgba(255,255,255,.85)}

/* ---------- 누를 때·전환 효과 (모든 디자인) ---------- */
:is(.btn,.tab,.side-btn,.seg button,.stat,.cmdk-it,.cell,.pop-item,.th,.search-pill,.fab,.icon-btn,.chk,.linkbtn){position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.btn,.side-btn,.stat,.cell,.pop-item,.th,.search-pill,.fab,.icon-btn,.chk,.task,.cand,.srcitem{transition:transform .18s cubic-bezier(.3,1.4,.5,1),background .25s,box-shadow .25s,border-color .25s,color .2s,opacity .25s,filter .2s}
:is(.btn,.side-btn,.seg button,.pop-item,.th,.search-pill,.fab,.icon-btn,.cmdk-it,.tab):active:not(:disabled){transform:scale(.96)}
:is(.stat,.cell):active{transform:scale(.97)}
.chk:active{transform:scale(.86)}
.stat:hover{transform:translateY(-3px)}
html[data-theme="aurora"] .stat:hover{box-shadow:0 18px 40px rgba(84,60,120,.18)}
.task:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.06)}
html[data-theme="aurora"] .task:hover{box-shadow:var(--glass-hl),0 12px 30px rgba(84,60,120,.12)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;transform:scale(0);animation:rip .62s cubic-bezier(.2,.7,.3,1) forwards;z-index:0}
html[data-theme="aurora"] .rip{background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.4) 45%,transparent 70%);opacity:.9}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes chkpop{0%{transform:scale(.55)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes doneFade{from{opacity:1}to{opacity:.55}}
@keyframes titleIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
main.page-in>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
main.page-in>*:nth-child(2){animation-delay:.05s}
main.page-in>*:nth-child(3){animation-delay:.1s}
main.page-in>*:nth-child(4){animation-delay:.15s}
main.page-in>*:nth-child(5){animation-delay:.2s}
main.page-in>*:nth-child(n+6){animation-delay:.24s}
main.view-in>.card:last-of-type{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.page-title.page-in{animation:titleIn .45s cubic-bezier(.2,.8,.2,1) both}
.modal-bg{animation:fadeIn .2s ease both}
.modal{animation:popIn .3s cubic-bezier(.2,.9,.3,1.15) both}
.cmdk-bg:not(.hidden){animation:fadeIn .18s ease both}
.cmdk-bg:not(.hidden) .cmdk{animation:popIn .28s cubic-bezier(.2,.9,.3,1.15) both}
.pop:not(.hidden){animation:popIn .22s cubic-bezier(.2,.9,.3,1.15) both}
.task.just.done{animation:doneFade .5s ease both}
.task.just.done .chk{animation:chkpop .5s cubic-bezier(.3,1.6,.5,1)}
.task.just:not(.done) .chk{animation:chkpop .4s cubic-bezier(.3,1.6,.5,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ---------- 오늘의 하늘: 근무 진행 + 해·달 경로 ---------- */
.work{padding:20px 24px 18px;position:relative;overflow:hidden;transition:background 1.6s ease,color 1.6s ease}
.work-k{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.02em;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.work-edit{font-size:13px;padding:3px 7px;margin-left:2px}
.work-msg{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em;line-height:1.35}
.work-msg em{font-style:normal;color:var(--primary)}
.sky-sub{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13.5px;font-weight:600;color:var(--text2)}
.sky-sub b{font-weight:800;color:inherit}
.solar{display:block;width:100%;height:auto;margin-top:10px;overflow:visible;color:var(--text)}
.solar .hz{stroke:currentColor;stroke-opacity:.32;stroke-width:1.3}
.solar .tick{font-size:12px;fill:currentColor;fill-opacity:.5;font-family:var(--font);font-weight:600}
.solar .sunpath{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.solar .moonpath{fill:none;stroke:currentColor;stroke-opacity:.32;stroke-width:1.5;stroke-dasharray:1.5 5;stroke-linecap:round}
.solar .band{fill:var(--primary);fill-opacity:.07}
.solar .band-l{stroke:var(--primary);stroke-opacity:.5;stroke-dasharray:3 4;stroke-width:1.2}
.solar .bandtxt{font-size:12px;fill:var(--primary);font-weight:800;font-family:var(--font)}
.solar .now{stroke:currentColor;stroke-opacity:.38;stroke-dasharray:2 3;stroke-width:1.2}
.solar .mk{font-size:12.5px;font-weight:700;font-family:var(--font);fill:currentColor;fill-opacity:.75}
.solar .mkdot{fill:currentColor;fill-opacity:.6}
.work-bar{height:12px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden;position:relative;margin-top:12px;border:1px solid transparent}
html[data-theme="aurora"] .work-bar{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(84,60,120,.10);border-color:rgba(255,255,255,.8)}
.work-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#FFC58A,var(--primary));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
html[data-theme="aurora"] .work-bar i{background:linear-gradient(90deg,#FFC08A,#F38A7A 45%,#C79BF0);box-shadow:0 0 14px rgba(243,138,122,.45)}
.work-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s ease-in-out infinite;transform:translateX(-100%)}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.work-ticks{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text3);font-weight:600;margin-top:8px}
.work-ticks b{color:var(--text);font-size:15px}
.work-off .work-bar i{background:linear-gradient(90deg,#B9B4F2,#8C86E8)}
/* 하늘빛: 낮 · 해 뜰 무렵 · 노을 · 밤 */
.work.sky-day{background:linear-gradient(165deg,rgba(214,234,255,.95),rgba(255,255,255,.82) 50%,rgba(255,238,224,.9))!important}
.work.sky-dawn{background:linear-gradient(165deg,rgba(255,222,200,.95),rgba(250,196,206,.86) 55%,rgba(205,188,240,.9))!important}
.work.sky-dusk{background:linear-gradient(165deg,rgba(255,204,170,.96),rgba(245,160,170,.88) 52%,rgba(160,140,220,.92))!important}
.work.sky-night{color:#EEF0FF;background:
  radial-gradient(1.4px 1.4px at 8% 18%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 23% 62%,rgba(255,255,255,.8) 60%,transparent),
  radial-gradient(1.6px 1.6px at 41% 12%,#fff 60%,transparent),radial-gradient(1.1px 1.1px at 57% 44%,rgba(255,255,255,.7) 60%,transparent),
  radial-gradient(1.5px 1.5px at 72% 20%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 88% 55%,rgba(255,255,255,.8) 60%,transparent),
  radial-gradient(1.3px 1.3px at 95% 10%,#fff 60%,transparent),
  linear-gradient(165deg,#1A1F3E,#272650 55%,#3A2D5A)!important;border-color:rgba(255,255,255,.15)!important}
.work.sky-night .solar{color:#EEF0FF}
.work.sky-night :is(.work-k,.sky-sub,.work-ticks){color:rgba(238,240,255,.78)}
.work.sky-night .work-ticks b{color:#fff}
.work.sky-night .work-msg em{color:#FFC58A}
.work.sky-night .work-bar{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
.work.sky-night .icon-btn:hover{background:rgba(255,255,255,.14)}
.work.sky-night .solar .band{fill:#FFC58A;fill-opacity:.08}
.work.sky-night .solar .bandtxt{fill:#FFC58A}
.work.sky-night .solar .band-l{stroke:#FFC58A}
/* 화면 전체 밝기: 해의 높이에 따라 */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 3s ease,background 3s ease}
.shell{position:relative;z-index:1}
#ambient.dawn{opacity:1;background:linear-gradient(180deg,rgba(255,176,140,.14),rgba(255,200,170,.08))}
#ambient.dusk{opacity:1;background:linear-gradient(180deg,rgba(255,140,110,.16),rgba(150,110,200,.14))}
#ambient.night{opacity:1;background:linear-gradient(180deg,rgba(18,22,58,.34),rgba(40,28,80,.26))}
.side-work{margin-bottom:8px}
.side-work .sbar{height:6px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:5px}
.side-work .sbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC08A,var(--primary));transition:width 1s}
@media (max-width:760px){.work{padding:18px}.work-msg{font-size:18px}.solar .tick{font-size:26px}.solar .mk{font-size:26px}.solar .bandtxt{font-size:24px}.solar .sunpath{stroke-width:4}.sky-sub{font-size:13px}}
/* ---------- 날짜 칸 · 휠 날짜 피커 ---------- */
.date-btn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:40px}
.date-btn .dbi{opacity:.65;flex:none}
.date-btn.is-empty{color:var(--text3)}
.cand-grid .date-btn{padding:8px 10px;font-size:14px}
.dp-bg{position:fixed;inset:0;z-index:79;background:rgba(30,20,50,.18);animation:fadeIn .2s both}
.dp{position:fixed;z-index:80;width:352px;background:var(--surface-solid,var(--surface));color:var(--text);border:1px solid var(--border);border-radius:22px;box-shadow:0 26px 70px rgba(30,15,60,.25);padding:16px;animation:popIn .26s cubic-bezier(.2,.9,.3,1.15) both}
html[data-theme="aurora"] .dp{background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,255,255,.66));border-color:rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 26px 70px rgba(60,30,90,.24);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.dp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 4px 12px}
.dp-h b{font-size:13px;color:var(--text3)}
.dp-h span{font-size:18px;font-weight:800;letter-spacing:-.02em}
.dp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qchip{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;gap:5px;align-items:baseline;transition:transform .15s,background .2s,box-shadow .2s}
.qchip small{font-size:11px;color:var(--text3);font-weight:600}
.qchip:hover{background:var(--soft)}
.qchip:active{transform:scale(.95)}
.qchip.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.qchip.on small{color:inherit;opacity:.85}
html[data-theme="aurora"] .qchip{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(84,60,120,.07)}
html[data-theme="aurora"] .qchip.on{background:linear-gradient(135deg,#F7A374,#EC5F72);color:#fff}
.wheels{position:relative;display:grid;grid-template-columns:1.25fr 1fr 1.35fr;gap:4px;height:200px;border-radius:16px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
html[data-theme="aurora"] .wheels{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.85);box-shadow:inset 0 2px 8px rgba(84,60,120,.08)}
.wheels::before{content:"";position:absolute;left:6px;right:6px;top:80px;height:40px;border-radius:12px;background:var(--surface-solid,var(--surface));box-shadow:0 2px 10px rgba(0,0,0,.07);pointer-events:none}
html[data-theme="aurora"] .wheels::before{background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,255,255,.75));box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(84,60,120,.12)}
.wheel{position:relative;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;outline:none;perspective:600px;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wh-pad{height:80px}
.wh-it{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:16px;font-weight:700;cursor:pointer;user-select:none;transform-origin:50% 50%;will-change:transform,opacity;white-space:nowrap}
.wh-it small{font-size:12px;color:var(--text3);margin-left:3px}
.wh-it.sun small{color:var(--deadline)}
.wh-it.sat small{color:#3B7BDB}
.dp-f{display:flex;gap:8px;margin-top:14px}
@media (max-width:640px){.dp{left:0!important;right:0;bottom:0;top:auto!important;width:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sheetUp .32s cubic-bezier(.2,.9,.3,1) both}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
/* 반복 칩 */
.rep-chips{display:flex;flex-wrap:wrap;gap:6px}
.badge.rep{background:var(--event-soft);color:var(--event)}
/* ---------- 페이지 전환: 모달처럼 떠오르기 ---------- */
@keyframes sheetIn{from{transform:translateY(34px) scale(.955)}to{transform:none}}
@keyframes veilOut{0%{opacity:1}100%{opacity:0}}
main.page-in{animation:sheetIn .6s cubic-bezier(.2,.9,.25,1.06) both;transform-origin:50% 0}
.veil{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-theme="aurora"] .veil{background:linear-gradient(160deg,rgba(255,240,232,.45),rgba(236,226,255,.45))}
.veil.on{animation:veilOut .55s cubic-bezier(.4,0,.2,1) both}
.cu{font-variant-numeric:tabular-nums}

/* 오로라 요약 카드 */
html[data-theme="aurora"] .stat{position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;border:4px solid rgba(255,255,255,.92);box-shadow:0 12px 32px rgba(84,60,120,.13);padding:14px 18px;background:#F4C7C0}
html[data-theme="aurora"] .stat::before{content:"";position:absolute;inset:-35%;z-index:0;filter:blur(18px)}
html[data-theme="aurora"] .stat>*{position:relative;z-index:1}
html[data-theme="aurora"] .stat .k{order:2;color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 8px rgba(60,30,60,.25)}
html[data-theme="aurora"] .stat .v{color:#fff!important;font-size:38px;font-weight:800;text-shadow:0 2px 12px rgba(60,30,60,.18)}
html[data-theme="aurora"] .stat:nth-child(1)::before{background:radial-gradient(circle at 18% 28%,#FF8E9E 0,transparent 42%),radial-gradient(circle at 78% 18%,#FFC2A2 0,transparent 48%),radial-gradient(circle at 62% 88%,#E79AD9 0,transparent 52%),#F7A9B4}
html[data-theme="aurora"] .stat:nth-child(2)::before{background:radial-gradient(circle at 22% 70%,#FFA77E 0,transparent 45%),radial-gradient(circle at 80% 25%,#FFD99B 0,transparent 48%),radial-gradient(circle at 55% 95%,#F58BA0 0,transparent 50%),#FCB98F}
html[data-theme="aurora"] .stat:nth-child(3)::before{background:radial-gradient(circle at 20% 25%,#F7B8A4 0,transparent 42%),radial-gradient(circle at 70% 55%,#8FDCAF 0,transparent 46%),radial-gradient(circle at 35% 95%,#C9E89A 0,transparent 50%),#B9E2C1}
html[data-theme="aurora"] .stat:nth-child(4)::before{background:radial-gradient(circle at 25% 30%,#A9B8F7 0,transparent 44%),radial-gradient(circle at 80% 70%,#F3B3D6 0,transparent 48%),radial-gradient(circle at 60% 10%,#C8B2F5 0,transparent 50%),#C3BDF2}

  --bg:#F3F6F4;--surface:#FFFFFF;--surface2:#F6F9F7;--text:#16241F;--text2:#3F534B;--text3:#7C8D86;--border:#E1E9E4;

html[data-theme="chagok"] .stat:nth-child(4){border-top-color:#FFC857}
html[data-theme="edufine"]{
  --font:"ChagokGothicE","NanumGothic","나눔고딕","Malgun Gothic","맑은 고딕",sans-serif;

/* 공통: 업무 시스템처럼 반듯하게 */
html[data-theme="edufine"] body,html[data-theme="neis"] body{letter-spacing:0}
html:is([data-theme="edufine"],[data-theme="neis"]) :is(.card,.stat,.hero){box-shadow:none;border:1px solid var(--border)}
html:is([data-theme="edufine"],[data-theme="neis"]) .greet::before{display:none}
html:is([data-theme="edufine"],[data-theme="neis"]) .cell{background:#fff;border:1px solid var(--border);border-radius:0}
@media (min-width:901px){
  html:is([data-theme="edufine"],[data-theme="neis"]) .side{margin:0;top:0;height:100vh;border-radius:0;border-width:0 1px 0 0;box-shadow:none;padding:0 0 12px}
  html:is([data-theme="edufine"],[data-theme="neis"]) .brand{padding:14px 16px;margin-bottom:0}
  html:is([data-theme="edufine"],[data-theme="neis"]) .side-l{margin:0;padding:9px 16px;letter-spacing:0;font-size:13px}
  html:is([data-theme="edufine"],[data-theme="neis"]) .tabs,html:is([data-theme="edufine"],[data-theme="neis"]) .side-more{gap:0}
  html:is([data-theme="edufine"],[data-theme="neis"]) :is(.tab,.side-btn){border-radius:0;padding:11px 18px;border-bottom:1px solid var(--border)}
  html:is([data-theme="edufine"],[data-theme="neis"]) .side-foot{margin:12px 12px 0}
  html:is([data-theme="edufine"],[data-theme="neis"]) main{padding-top:22px}
}

html[data-theme="edufine"] .side-l{background:#2D3E50;color:#fff}

html[data-theme="edufine"] .tab.on{font-weight:700}

html[data-theme="edufine"] .btn.pri{background:#3F8606}

html[data-theme="edufine"] .hero{background:#EFF7E0;border-color:#9CC867}
html[data-theme="edufine"] .card h2,html[data-theme="edufine"] .hero h2{color:#1E1E1E}
html[data-theme="edufine"] .stat{border-top:3px solid #59595B}
html[data-theme="edufine"] .stat.red{border-top-color:#E60012}
html[data-theme="edufine"] .stat.blue{border-top-color:#2C85BF}

html[data-theme="edufine"] .week-day .wd-h.today{background:#2C85BF;color:#fff}
html[data-theme="edufine"] .cell.today{border:2px solid #2C85BF}
html[data-theme="edufine"] .th.on{border-color:#2C85BF}
/* 나이스 스타일: 파란 윗줄, 파란 막대 제목, 하늘빛 회색 칸 */

/* ---------- 교표 색 테마 (오남 · 우리 학교) ---------- */
html[data-kind="school"] body{background:radial-gradient(1100px 620px at -5% -12%,var(--tint1),transparent 62%),radial-gradient(900px 560px at 108% -6%,var(--tint2),transparent 60%),radial-gradient(800px 500px at 50% 112%,var(--tint3),transparent 60%),var(--bg);background-attachment:fixed}
html[data-kind="school"] :is(.side,.card){border:1px solid var(--border)}
html[data-kind="school"] .side{background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(255,255,255,.74));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
html[data-kind="school"] .card{background:rgba(255,255,255,.9)}
html[data-kind="school"] .btn.pri{box-shadow:0 6px 16px var(--pshadow)}
html[data-kind="school"] .stat{border-top:4px solid var(--border)}
html[data-kind="school"] .stat.red{border-top-color:var(--deadline)}
html[data-kind="school"] .stat.blue{border-top-color:var(--sc1)}
html[data-kind="school"] .stat:nth-child(3){border-top-color:var(--sc2)}
html[data-kind="school"] .stat:nth-child(4){border-top-color:var(--sc3)}
html[data-kind="school"] .work-bar i{background:linear-gradient(90deg,var(--sc3),var(--sc2) 48%,var(--sc1));box-shadow:0 0 12px var(--pshadow)}
html[data-kind="school"] .work-off .work-bar i{background:linear-gradient(90deg,#B9B4F2,#8C86E8);box-shadow:none}
html[data-kind="school"] .task.done .chk{background:var(--ok);border-color:var(--ok)}
/* 교표 색 띠: 학교의 세 가지 색을 교표 비율대로 */
.school-band{display:none;gap:3px;height:6px;margin:2px 10px 12px;border-radius:999px}
.school-band i{display:block;border-radius:999px;transform-origin:left;animation:bandIn .7s cubic-bezier(.2,.8,.2,1) both}
.school-band i:nth-child(1){flex:5;background:var(--sc1)}
.school-band i:nth-child(2){flex:3;background:var(--sc2);animation-delay:.08s}
.school-band i:nth-child(3){flex:1.4;background:var(--sc3);animation-delay:.16s}
html[data-kind="school"] .school-band{display:flex}
@keyframes bandIn{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.school-band i{animation:none}}
.st-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:620px){.st-grid{grid-template-columns:minmax(0,1fr)}}
.st-drop{border:2px dashed var(--border);border-radius:var(--radius);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;background:var(--surface2);cursor:pointer;transition:border-color .2s,background .2s}
.st-drop.over,.st-drop:hover{border-color:var(--primary);background:var(--soft)}
.st-drop img{max-width:100%;max-height:150px;object-fit:contain;border-radius:10px}
.st-chips{display:flex;flex-wrap:wrap;gap:8px;min-height:38px}
.st-chip{width:38px;height:38px;border-radius:12px;border:2px solid #fff;box-shadow:0 0 0 1px var(--border),0 3px 8px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s}
.st-chip:hover{transform:translateY(-2px) scale(1.06)}
.st-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st-slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;font-size:13.5px;min-width:0}
.st-slot.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}
.st-slot input[type=color]{width:30px;height:30px;padding:0;border:0;border-radius:9px;background:none;cursor:pointer;flex:none}
.st-slot input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.st-slot input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.08);border-radius:9px}
.st-slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-prev{border-radius:var(--radius);padding:14px;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.st-prev .school-band{display:flex;margin:0}
.st-prev .row{gap:8px;align-items:center}
.st-prev .mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-weight:700;display:flex;gap:8px;align-items:center}
.st-prev .mini .chk{width:18px;height:18px;border-radius:6px;background:var(--ok);flex:none}
/* ---------- 사진 ---------- */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb-w{position:relative;display:inline-block}
.thumb{width:72px;height:72px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface2);cursor:zoom-in;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:40px;height:40px;border-radius:8px}
.thumb.add{cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--text2);border-style:dashed;background:transparent}
.thumb.add:hover{border-color:var(--primary);color:var(--primary);background:var(--soft)}
.thumb-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);background:var(--text);color:#fff;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.src-img{display:block;max-width:100%;max-height:420px;margin:0 0 12px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:zoom-in;background:#fff}
.memo .thumbs{margin:2px 0 8px}
.lightbox{position:fixed;inset:0;z-index:300;background:rgba(10,12,18,.88);display:flex;flex-direction:column;animation:fadeIn .18s ease}
.lightbox .lb-top{display:flex;align-items:center;gap:8px;padding:12px 16px;color:#fff}
.lightbox .lb-top b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox .lb-top .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25);text-decoration:none}
.lightbox .lb-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;position:relative}
.lightbox .lb-main img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
.lightbox .lb-nav.prev{left:18px}.lightbox .lb-nav.next{right:18px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ocr-bar{height:4px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:6px}
.ocr-bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.src-group-h .thumb{margin-right:4px}
/* ---------- 기본 ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;font-feature-settings:"tnum" 0;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.01em}
a{color:var(--primary)}
.hidden{display:none!important}
/* 레이아웃: 왼쪽 메뉴 + 본문 */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.side{position:sticky;top:16px;margin:16px 0 16px 16px;width:244px;flex:none;height:calc(100vh - 32px);background:var(--header-bg);color:var(--header-text);border:1px solid var(--header-border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:18px 12px 12px;z-index:20;overflow:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 6px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.logo svg,.logo img{width:100%;height:100%;display:block;object-fit:contain}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;color:var(--header-text)}
.brand p{margin:0;font-size:12.5px;color:var(--header-sub);white-space:nowrap}
.side-l{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--header-sub);margin:20px 12px 6px}
.tabs,.side-more{display:flex;flex-direction:column;gap:3px}
.tab,.side-btn{border:0;background:transparent;color:var(--tab-text);padding:10px 12px;border-radius:var(--tab-radius);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;display:flex;align-items:center;gap:10px;text-align:left;width:100%;transition:background .15s}
.tab:hover,.side-btn:hover{background:rgba(0,0,0,.045)}
.tabs{position:relative}
.tab{position:relative;z-index:1}
.tab.on{background:transparent;color:var(--tab-active-text)}
.tab-ind{position:absolute;left:0;top:0;z-index:0;border-radius:var(--tab-radius);background:var(--tab-active-bg);box-shadow:var(--tab-active-shadow,none);transition:transform .46s cubic-bezier(.3,1.25,.4,1),width .46s cubic-bezier(.3,1.25,.4,1),height .3s;pointer-events:none}
html[data-theme="aurora"] .tab-ind{background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,255,255,.78));box-shadow:inset 0 1px 0 #fff,0 6px 18px rgba(84,60,120,.12);border:1px solid rgba(255,255,255,.9)}
.ti{width:22px;text-align:center;flex:none}
.tab .cnt{margin-left:auto;background:var(--deadline);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;line-height:18px;font-weight:700}
.side-btn kbd{margin-left:auto}
.side-foot{margin-top:auto;padding:12px;border-radius:var(--radius-sm);background:rgba(0,0,0,.035);font-size:12.5px;color:var(--header-sub);line-height:1.55}
html[data-theme="aurora"] .side-foot{background:rgba(255,255,255,.55)}
.side-foot b{color:var(--header-text)}
.linkbtn{border:0;background:none;padding:0;color:var(--primary);font-weight:700;cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
html[data-theme="naver"] .linkbtn,html[data-theme="kakao"] .linkbtn{color:inherit}
kbd{font-family:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:0 6px;line-height:18px;background:var(--surface-solid,var(--surface));color:var(--text2);white-space:nowrap}
.content{flex:1;min-width:0}
.seat-host{max-width:1480px;margin:0 auto;padding:10px 8px 20px}
.seat-host iframe{display:block;width:100%;height:calc(100vh - 128px);min-height:620px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);box-shadow:var(--shadow)}
/* ---------- 🏃 달리기 뽑기 ---------- */
.pick-host{max-width:1480px;margin:0 auto;padding:10px 8px 24px}
.pick-wrap{display:flex;flex-direction:column;gap:12px}
.pick-wrap:fullscreen{background:var(--bg);padding:14px;overflow:auto}
.pick-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px}
.pick-bar .pk-title{font-weight:800;font-size:17px;margin-right:auto;display:flex;flex-direction:column;gap:2px}
.pick-bar .pk-title small{font-weight:500;font-size:12.5px;color:var(--text3)}
.pk-step{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.pk-step button{border:0;background:transparent;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--text)}
.pk-step button:hover{background:var(--surface2)}
.pk-step output{min-width:34px;text-align:center;font-weight:800;font-size:16px}
.pk-lbl{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text2)}
.pk-chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text2);cursor:pointer}
.pk-chk input{width:16px;height:16px;accent-color:var(--primary)}
.pick-bar .btn.pri{font-size:16px;padding:11px 22px}
.pick-stage{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#F7E9D7}
.pick-stage canvas{display:block;width:100%}
.pk-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:color-mix(in srgb,#1d2430 45%,transparent);backdrop-filter:blur(2px);padding:18px;animation:pkIn .35s ease}
@keyframes pkIn{from{opacity:0}to{opacity:1}}
.pk-overlay.hidden{display:none}
.pk-res{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-height:78%;overflow:auto;padding:4px}
.pk-card{background:var(--surface);color:var(--text);border-radius:18px;padding:16px 18px 14px;min-width:150px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pkPop .5s cubic-bezier(.3,1.5,.5,1) both}
.pk-card:nth-child(2){animation-delay:.08s}.pk-card:nth-child(3){animation-delay:.16s}.pk-card:nth-child(n+4){animation-delay:.24s}
@keyframes pkPop{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.pk-card .pk-rank{display:inline-block;font-weight:800;font-size:13px;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.pk-card .pk-face{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;background:var(--surface2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;border:4px solid var(--soft)}
.pk-card .pk-no{font-size:13px;color:var(--text3);font-weight:700}
.pk-card .pk-name{font-size:24px;font-weight:800;letter-spacing:-.02em}
.pk-overlay .pk-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pk-seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface2)}
.pk-seg button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:700;color:var(--text2);cursor:pointer}
.pk-seg button.on{background:var(--primary);color:var(--on-primary)}
.pk-order{background:var(--surface);color:var(--text);border-radius:20px;padding:16px 18px;width:min(1100px,100%);max-height:82%;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pkPop .45s cubic-bezier(.3,1.4,.5,1) both}
.pk-oh{font-weight:800;font-size:18px;margin-bottom:12px}
.pk-oh small{font-weight:500;font-size:13px;color:var(--text3);margin-left:6px}
.pk-ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.pk-ol li{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border-radius:14px;background:var(--surface2)}
.pk-ol li.top{background:var(--soft)}
.pk-ol li b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:14px}
.pk-ol li i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;border:2px solid var(--surface)}
.pk-ol li span{font-weight:800;font-size:16px;line-height:1.15;min-width:0}
.pk-ol li em{display:block;font-style:normal;font-weight:600;font-size:12px;color:var(--text3)}
.pick-roster{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.pick-roster .pk-rh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.pick-roster .pk-rh b{font-size:15px}
.pick-roster .pk-rh .sp{flex:1}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px}
.pk-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:3px 10px 3px 3px;font-size:13.5px;cursor:pointer;font-family:inherit}
.pk-chip i{width:24px;height:24px;border-radius:50%;background:var(--surface2) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.pk-chip.out{opacity:.38;text-decoration:line-through}
.pk-chip.used{background:var(--soft);color:var(--soft-text);border-color:transparent}
.pk-chip.used::after{content:'✓';font-weight:800}
.pk-manual{margin-top:10px}
.pk-manual textarea{width:100%;min-height:110px}
@media (max-width:900px){.pick-host{padding:8px 8px 90px}.pick-bar .pk-title{width:100%}}
.seat-host .seat-wait{padding:60px 20px;text-align:center;color:var(--text3)}
/* 📆 일정 협의 */
.mt-hero{background:linear-gradient(180deg,var(--soft),var(--surface) 140px)}
.mt-steps{display:grid;gap:10px;margin-top:6px}
.mt-steps>div{display:flex;gap:12px;align-items:flex-start;line-height:1.55}
.mt-steps b:first-child{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:14px}
.mt-steps a{color:var(--primary);font-weight:700}
.mt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.mt-list .card{margin:0}
.mt-it-t{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.mt-it-m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge.mt-cnt{background:var(--soft);color:var(--soft-text)}
.badge.mt-closed{background:var(--text);color:var(--surface)}
.mt-dchip.off{text-decoration:line-through;opacity:.45;border-style:dashed}
.mt-chips{gap:6px}
.mt-sw{padding:10px 0;border-top:1px solid var(--border)}
.mt-sw:first-of-type{border-top:0}
.mt-sw .switch{align-items:flex-start}
.mt-sumcard{background:var(--soft);color:var(--soft-text)}
.mt-sum{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mt-title{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.mt-links{margin-top:14px;display:grid;gap:12px}
.mt-rank{list-style:none;margin:0;padding:0}
.mt-rank li{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.mt-rank li:first-child{border-top:0}
.mt-rank .n{font-size:22px;font-weight:800;min-width:3.2em;text-align:right;color:var(--primary)}
.mt-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
.mt-g{border-collapse:separate;border-spacing:3px;margin:6px}
.mt-g th{font-size:12.5px;font-weight:700;white-space:nowrap;padding:3px 6px;color:var(--text2)}
.mt-g thead th{line-height:1.25;text-align:center}
.mt-g thead .d{font-size:14px;color:var(--text);font-weight:800}
.mt-g thead th.sun .w{color:var(--deadline)}.mt-g thead th.sat .w{color:var(--event)}
.mt-g tbody th{text-align:right;position:sticky;left:0;background:var(--surface);z-index:1}
.mt-c{display:block;width:clamp(42px,7vw,60px);height:32px;border:0;border-radius:7px;cursor:pointer;font-weight:700;font-size:12px;color:var(--text);padding:0;background:color-mix(in srgb,var(--primary) calc(18% + var(--h,0) * 82%),var(--surface))}
.mt-c.z{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);cursor:default}
.mt-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text3);margin:0 2px 10px}
.mt-legend i{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.mt-legend .gbar{width:84px;margin:0 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 18%,var(--surface)),var(--primary))}
.mt-c.hi{color:var(--on-primary)}
.mt-c.pick{outline:3px solid var(--deadline);outline-offset:1px}
.mt-names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mt-names span{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13.5px}
.mt-who{border:2px solid var(--primary)!important}
.mt-tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.mt-tbl th,.mt-tbl td{padding:9px 8px;border-top:1px solid var(--border);text-align:left}
.mt-tbl th{color:var(--text3);font-size:13px;border-top:0}
.mt-tbl .r{text-align:right;white-space:nowrap}
@media (max-width:900px){.seat-host{padding:8px 10px 90px}.seat-host iframe{height:calc(100vh - 170px);min-height:560px}}
.topbar{max-width:1080px;margin:0 auto;padding:30px 20px 6px;display:flex;align-items:center;gap:14px}
.page-title{font-size:34px;font-weight:800;letter-spacing:-.035em;color:var(--text)}
.search-pill{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);color:var(--text3);border-radius:999px;padding:9px 10px 9px 16px;cursor:pointer;font-size:14px;min-width:300px;box-shadow:var(--shadow);font-weight:500}
.search-pill:hover{color:var(--text2)}
.search-pill .st{flex:1;text-align:left}
/* 본문 */
main{max-width:1080px;margin:0 auto;padding:16px 20px 120px}
.banner-area{max-width:1080px;margin:0 auto;padding:0 20px}
.banner{margin-top:14px;background:var(--soft);color:var(--soft-text);border-radius:var(--radius-sm);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:500}
.banner.warn{background:var(--deadline-soft);color:var(--deadline)}
.banner .sp{flex:1}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;border:1px solid transparent}
html[data-theme="naver"] .card,html[data-theme="claude"] .card{border-color:var(--border)}
.card h2{font-size:18px;font-weight:700;margin-bottom:6px}
html[data-theme="claude"] .card h2{font-weight:600;font-size:19px}
.card .desc{color:var(--text3);font-size:14px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:180px}
.sp{flex:1}
.muted{color:var(--text3)}
.small{font-size:13px}
label.fl{display:block;font-size:13px;color:var(--text2);font-weight:600;margin:0 0 6px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:var(--radius-sm);padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);background:var(--surface)}
html[data-theme="kakao"] .inp:focus{border-color:#191919;box-shadow:0 0 0 3px rgba(254,229,0,.5)}
html[data-theme="chatgpt"] .inp:focus{box-shadow:none}
textarea.inp{min-height:180px;resize:vertical;line-height:1.6}
.btn{border:0;border-radius:var(--btn-radius);padding:11px 18px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--text);transition:filter .15s,background .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;font-size:14.5px;border:1px solid transparent}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-hover);filter:none}
.btn.line{background:transparent;border-color:var(--border)}
.btn.danger{background:var(--deadline);color:#fff}
.btn.danger-line{background:transparent;color:var(--deadline);border-color:color-mix(in srgb,var(--deadline) 40%,transparent)}
.btn.sm{padding:7px 12px;font-size:13.5px}
.btn.xs{padding:4px 9px;font-size:12.5px;font-weight:600}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--surface2)}
/* 자동 저장 스위치 */
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:4px 6px;border-radius:12px}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sl{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;flex:none;transition:background .2s}
.switch .sl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.sl{background:var(--primary)}
html[data-theme="kakao"] .switch input:checked+.sl{background:#191919}
.switch input:checked+.sl::after{transform:translateX(18px)}
.switch input:focus-visible+.sl{outline:2px solid var(--primary);outline-offset:2px}
.sw-t{display:flex;flex-direction:column;line-height:1.3;font-size:14px}
.card.fresh{border:2px solid var(--primary)!important;background:linear-gradient(180deg,var(--soft),var(--surface) 90px)}
.badge.new{background:var(--primary);color:var(--on-primary)}
html[data-theme="kakao"] .badge.new{background:#191919;color:#FEE500}
/* 정리 결과 */
.card.preview{border:2px solid var(--primary)!important}
.unsure-h{margin:14px 2px 8px;font-weight:700;font-size:14px;color:var(--text2)}
.commit-row{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.big-btn{padding:13px 26px;font-size:16px}
.banner.okb{background:var(--soft);color:var(--soft-text)}
/* 인사 카드 */
.greet{text-align:center;padding:30px 22px 24px;position:relative;overflow:hidden}
.greet::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,27,38,.10) 1px,transparent 1.3px);background-size:10px 10px;-webkit-mask-image:radial-gradient(circle at 50% 22%,#000 0,transparent 30%);mask-image:radial-gradient(circle at 50% 22%,#000 0,transparent 30%);pointer-events:none}
.orb{width:66px;height:66px;border-radius:50%;margin:0 auto 16px;position:relative;background:radial-gradient(circle at 32% 28%,#fff 0,var(--orb1) 24%,var(--orb2) 74%);box-shadow:0 12px 30px color-mix(in srgb,var(--orb2) 38%,transparent),inset -6px -8px 16px rgba(0,0,0,.08)}
.greet .greet-t{font-size:27px;margin:0;font-weight:500;line-height:1.35;letter-spacing:-.025em;color:var(--text2);position:relative}
.greet-t b{color:var(--text);font-weight:800}
.greet .steps{justify-content:center;margin-top:18px;position:relative}
/* 명령창 */
.cmdk-bg{position:fixed;inset:0;z-index:70;background:rgba(20,16,30,.26);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmdk{width:min(640px,100%);background:var(--surface-solid,var(--surface));color:var(--text);border-radius:22px;box-shadow:0 30px 90px rgba(20,10,40,.30);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;max-height:72vh}
html[data-theme="aurora"] .cmdk{-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border-color:rgba(255,255,255,.9)}
.cmdk-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.cmdk-in .orb{width:26px;height:26px;margin:0;box-shadow:none;flex:none}
.cmdk-in input{flex:1;border:0;outline:0;background:transparent;font-size:17px;min-width:0}
.cmdk-list{overflow:auto;padding:6px 8px 8px}
.cmdk-g{font-size:11.5px;font-weight:700;color:var(--text3);padding:10px 10px 4px;letter-spacing:.03em}
.cmdk-it{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-size:14.5px;color:var(--text)}
.cmdk-it .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:none;font-size:15px}
.cmdk-it .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cmdk-it .sb{color:var(--text3);font-size:12.5px;white-space:nowrap}
.cmdk-it.on{background:var(--soft);color:var(--soft-text)}
.cmdk-it.on .ic{background:var(--surface-solid,var(--surface))}
.cmdk-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);flex-wrap:wrap}
.cmdk-foot span{display:flex;gap:4px;align-items:center}
.cmdk-empty{padding:28px 10px;text-align:center;color:var(--text3)}
/* 첫 화면 */
.hero{background:linear-gradient(135deg,var(--soft) 0%,var(--surface) 70%);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h2{font-size:22px;font-weight:800;margin-bottom:4px}
.hero p{margin:0;color:var(--text2)}
.steps{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px}
.steps b{width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:13px}
.logo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo-big{width:84px;height:84px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.10);flex:none}
.logo-big svg,.logo-big img{width:100%;height:100%;display:block;object-fit:contain}
/* 드롭존 */
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:34px 18px;text-align:center;cursor:pointer;background:var(--surface2);transition:.15s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--soft)}
.drop .big{font-size:34px;line-height:1}
.drop b{display:block;margin:10px 0 4px;font-size:16px}
.fmt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.fmt span{font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--text2)}
.status-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.status{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface2);font-size:14px}
.status .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.status.err{background:var(--deadline-soft);color:var(--deadline)}
.status .msg{flex:1}
/* 요약 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;text-align:left}
html[data-theme="naver"] .stat,html[data-theme="claude"] .stat{border-color:var(--border)}
.stat .k{font-size:13px;color:var(--text3);font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin-top:2px;font-family:var(--font-head)}
.stat.red .v{color:var(--deadline)}
.stat.blue .v{color:var(--primary)}
html[data-theme="kakao"] .stat.blue .v{color:#191919}
/* 보기 전환 */
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--btn-radius);padding:4px;gap:2px;flex-wrap:wrap;border:1px solid var(--border)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:calc(var(--btn-radius) - 2px);cursor:pointer;font-weight:600;color:var(--text2);font-size:14px}
.seg{position:relative}
.seg button{position:relative;z-index:1;transition:color .25s}
.seg button.on{background:transparent;color:var(--text)}
.seg-ind{position:absolute;left:0;top:0;z-index:0;border-radius:calc(var(--btn-radius) - 2px);background:var(--seg-on-bg,var(--surface));box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .42s cubic-bezier(.3,1.25,.4,1),width .42s cubic-bezier(.3,1.25,.4,1),height .3s;pointer-events:none}
html[data-theme="kakao"]{--seg-on-bg:#FEE500}
html[data-theme="chatgpt"]{--seg-on-bg:#0D0D0D}
html[data-theme="chatgpt"] .seg button.on{color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
/* 할 일 */
.group-h{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-weight:700;font-size:15px}
.group-h:first-child{margin-top:4px}
.group-h .muted{font-weight:500;font-size:13px}
.group-h.red{color:var(--deadline)}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);margin-bottom:8px;position:relative}
.task::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--etc)}
.task.t-deadline::before{background:var(--deadline)}
.task.t-event::before{background:var(--event)}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-size:13px;font-weight:900;margin-top:1px;padding:0}
.chk:hover{border-color:var(--primary)}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.t-body{flex:1;min-width:0}
.t-title{font-weight:650;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.t-meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:13px;color:var(--text3)}
.t-memo{margin-top:6px;font-size:13px;color:var(--text2);background:var(--surface2);padding:6px 10px;border-radius:8px;white-space:pre-wrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--etc-soft);color:var(--etc)}
.badge.deadline{background:var(--deadline-soft);color:var(--deadline)}
.badge.event{background:var(--event-soft);color:var(--event)}
.dday{font-weight:800;font-size:12.5px;color:var(--text2)}
.dday.hot{color:var(--deadline)}
.dday.past{color:var(--deadline)}
.src{cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.src:hover{color:var(--text)}
.t-act{display:flex;gap:2px;flex:none}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:5px 8px;border-radius:8px;color:var(--text3);font-size:14px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.empty{text-align:center;color:var(--text3);padding:34px 10px}
.empty .big{font-size:32px;margin-bottom:6px}
.empty-day{color:var(--text3);font-size:13px;padding:2px 4px 6px}
/* 주간 */
.week-day{margin-bottom:6px}
.week-day .wd-h{display:flex;gap:8px;align-items:center;font-weight:700;margin:14px 2px 8px}
.week-day .wd-h.today{color:var(--primary)}
html[data-theme="kakao"] .week-day .wd-h.today{color:#191919;background:#FEE500;border-radius:8px;padding:2px 8px;display:inline-flex}
.wd-h .pill{font-size:12px;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:0 8px}
/* 달력 */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12.5px;color:var(--text3);font-weight:700;padding:4px 0}
.cal .dow.sun,.cell.sun .num{color:var(--deadline)}
.cal .dow.sat,.cell.sat .num{color:#3B7BDB}
.cell{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;font:inherit;color:inherit;min-height:96px;background:var(--surface2);border-radius:10px;padding:6px;cursor:pointer;border:2px solid transparent;overflow:hidden;text-align:left}
.cell.other{opacity:.4}
.cell.today{border-color:var(--primary)}
html[data-theme="kakao"] .cell.today{border-color:#191919}
.cell.sel{background:var(--soft)}
.cell .num{font-size:13px;font-weight:700;margin-bottom:3px}
.chip{font-size:11.5px;line-height:1.35;padding:2px 5px;border-radius:5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--etc-soft);color:var(--text2)}
.chip.deadline{background:var(--deadline-soft);color:var(--deadline)}
.chip.event{background:var(--event-soft);color:var(--event)}
.chip.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--text3);font-weight:600}
/* 확인하기 */
.src-group{margin-bottom:22px}
.src-group-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.src-group-h h3{font-size:16px}
.cand{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;display:flex;gap:12px}
.cand.off{opacity:.55;background:var(--surface2)}
.cand input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);margin-top:8px;flex:none;cursor:pointer}
html[data-theme="kakao"] .cand input[type=checkbox]{accent-color:#191919}
.cand-body{flex:1;min-width:0}
.cand-grid{display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr .9fr;gap:8px}
.cand-grid .inp{padding:8px 10px;font-size:14px;min-width:0}
.cand-grid>div{min-width:0}
@media (max-width:1000px){.cand-grid{grid-template-columns:1.2fr 1.2fr 1fr .9fr}.cand-grid .c-title{grid-column:1/-1}}
.cand-body{overflow:hidden}
.cand .sent{margin-top:9px;font-size:13px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:7px 10px;overflow-wrap:anywhere}
.cand .sent mark,.srctext mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.warn-t{color:var(--deadline);font-size:12.5px;font-weight:600;margin-top:6px}
.mini-l{font-size:11.5px;color:var(--text3);font-weight:600;margin-bottom:2px;display:block}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border)}
.sticky-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* 자료함 */
.srcitem{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;background:var(--surface)}
.srcitem.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:none}}
.srcitem .sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srcitem .sn{font-weight:700;flex:1;min-width:160px;overflow-wrap:anywhere}
.srctext{margin-top:12px;max-height:420px;overflow:auto;white-space:pre-wrap;font-size:13.5px;background:var(--surface2);border-radius:10px;padding:12px 14px;line-height:1.7;overflow-wrap:anywhere}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--text2);font-weight:600;border:1px solid var(--border)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:transparent}
/* 설정 */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.th{border:2px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;background:var(--surface);text-align:center;font-weight:700;font-size:13.5px}
.th.on{border-color:var(--primary)}
html[data-theme="kakao"] .th.on{border-color:#191919}
.th .pv{height:58px;border-radius:9px;margin-bottom:8px;position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.06)}
.th .pv i{position:absolute;display:block}
.maker{word-break:keep-all;margin-top:16px;padding:18px 18px 8px;border-radius:var(--radius);background:linear-gradient(135deg,var(--soft),var(--surface2));border:1px solid var(--border)}
.mk-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mk-h .mk-ico{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex:none}
.mk-h div{display:flex;flex-direction:column;line-height:1.25}
.mk-h b{font-size:18px}
.mk-story{margin:0 0 12px;line-height:1.85;color:var(--text2)}
.mk-whisper{display:block;margin:2px 0;font-size:12.5px;color:var(--text3);font-style:italic}
.mk-row{display:flex;gap:10px;padding:12px 0;border-top:1px dashed var(--border);color:var(--text2);line-height:1.7}
.mk-row .mk-i{flex:none;font-size:17px;line-height:1.6}
.mk-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mk-act .btn{text-decoration:none}
.danger-zone{border:1px solid color-mix(in srgb,var(--deadline) 30%,transparent)!important}
.clean-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--border)}
.clean-row:first-of-type{border-top:0;padding-top:4px}
.clean-row .cr-b{flex:1}
.clean-row h3{font-size:15.5px;margin-bottom:2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px}
.kv b{display:block;font-size:20px;font-family:var(--font-head)}
.kv span{font-size:12.5px;color:var(--text3);font-weight:600}
/* 팝오버 */
.pop{position:fixed;z-index:40;top:64px;left:16px;background:var(--surface-solid,var(--surface));color:var(--text);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;width:260px;border:1px solid var(--border)}
.pop h4{margin:4px 6px 8px;font-size:14px}
.t-ico{width:26px;height:26px;border-radius:9px;flex:none;display:inline-grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);overflow:hidden;vertical-align:middle}
.t-ico i{width:11px;height:11px;border-radius:50%;display:block;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.t-ico.emb{background:#fff;border-radius:50%}
.t-ico.emb img{width:100%;height:100%;object-fit:contain;display:block}
.t-ico.plus{background:var(--surface2);color:var(--text2);font-weight:700;font-size:15px}
.cmdk-it .ic .t-ico{width:22px;height:22px;border-radius:7px}
.cmdk-it .ic .t-ico.emb{border-radius:50%}
.th-n{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;line-height:1.25}
.th-n .t-ico{width:22px;height:22px;border-radius:7px}

@media (max-width:760px){.school-grid{grid-template-columns:minmax(0,1fr)}.sf{grid-template-columns:minmax(0,1fr) auto auto}.sf-l{grid-column:1/-1;padding:2px 4px}}

<script>
'use strict';
/* =========================================================
   차곡 — 자료를 쌓으면 날짜별 할 일로 정리해 주는 선생님용 프로그램
   - 외부 서버/API 없이 브라우저 안에서만 동작
   - 저장: IndexedDB (안 되면 localStorage, 그래도 안 되면 임시)
   ========================================================= */

/* ---------- 공통 도구 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const todayKey = () => keyOf(new Date());
const diffDays = (a, b) => Math.round((fromKey(a) - fromKey(b)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();
function hashText(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16) + '-' + s.length; }
function fmtDate(k) { const d = fromKey(k); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; }
function fmtShort(k) { const d = fromKey(k); return `${d.getMonth() + 1}.${d.getDate()}.(${WD[d.getDay()]})`; }
function fmtDateTime(iso) { const d = new Date(iso); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}. ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function mondayOf(d) { const w = (d.getDay() + 6) % 7; return addDays(d, -w); }
function fmtBytes(n) { if (n < 1024) return n + 'B'; if (n < 1048576) return (n / 1024).toFixed(1) + 'KB'; return (n / 1048576).toFixed(1) + 'MB'; }

/* =========================================================
   1. 할 일 찾기 엔진 (규칙 기반)
   ========================================================= */
const Extract = (() => {
  const DEADLINE = ['까지', '마감', '제출', '회신', '신청', '보고', '등록', '접수', '기한', '송부', '입력', '탑재', '납부', '작성'];
  const EVENT = ['개최', '실시', '회의', '협의회', '연수', '행사', '일시', '교육', '설명회', '워크숍', '워크샵', '방문', '출장', '면담', '수업', '시험', '평가', '축제', '캠프', '대회', '컨설팅', '공개', '참석', '발표', '모임', '총회', '세미나', '포럼', '상담', '체험', '견학', '점검', '운영', '진행', '예정'];
  const ASK = /(바랍니다|주시기|요청|부탁|해\s?주세요|하세요|할 것|해야|필요|해 주십시오|하시기)/;
  const STRONG = /(제출|회신|신청|보고|마감|등록|작성|송부|입력|탑재)/;
  const REF_LINE = /(관련\s*[:：]|^\s*(\d{1,2}|[가-하])\s*[.)]\s*관련|^\s*(시행|접수)\s+\S|문서번호|공개구분|생산일|^\s*\(?\s*경유\s*\)?)/;
  const LABEL = /^(일\s*시|기\s*간|일\s*자|날\s*짜|일\s*정|제출\s*기한|제출\s*기간|회신\s*기한|신청\s*기간|신청\s*기한|접수\s*기간|접수\s*기한|운영\s*기간|교육\s*기간|연수\s*기간|행사\s*일|마감\s*일?|기\s*한|시\s*간|장\s*소)\s*[:：]?\s*/;
  const LABEL_SUFFIX = { '제출': ' 제출', '회신': ' 회신', '신청': ' 신청', '접수': ' 접수', '마감': ' 마감' };
  const WEEK = { '월': 0, '화': 1, '수': 2, '목': 3, '금': 4, '토': 5, '일': 6 };
  const JSWD = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };

  const validYMD = (y, m, d) => { if (m < 1 || m > 12 || d < 1 || d > 31) return false; const t = new Date(y, m - 1, d); return t.getMonth() === m - 1 && t.getDate() === d; };

  // 한 줄에서 날짜 표현을 모두 찾는다
  function findDates(line, ref) {
    const found = [];
    const taken = new Uint8Array(line.length + 1);
    const push = (start, end, obj) => {
      for (let i = start; i < end; i++) if (taken[i]) return false;
      for (let i = start; i < end; i++) taken[i] = 1;
      found.push(Object.assign({ start, end }, obj));
      return true;
    };
    const refD = fromKey(ref);
    const tail = (end) => { // 뒤따르는 (목) 같은 요일 표시
      const m = /^\s*\(\s*([월화수목금토일])(?:요일)?\s*\)/.exec(line.slice(end));
      return m ? { wd: m[1], len: m[0].length } : null;
    };

/* 할 일 보기 블록 순서: 하늘 카드는 하루 첫 화면에만 맨 위, 이후엔 정한 순서 */

   붙여넣기·파일 → 자동 정리(미리보기) → [입력]으로 저장

function autoName(text, fallback) {
  const tm = /^\s*제\s*목\s*[:：]?\s*(.{2,60})$/m.exec(text);
  const first = tm ? tm[1].trim() : (Extract.splitLines(text)[0] || fallback || '붙여넣은 글');
  return first.length > 30 ? first.slice(0, 30) + '…' : first;
}
function organize(text, ref, name) {
  const have = new Set(S.tasks.map(t => (t.date || '') + '|' + t.title));
  return Extract.run(text, ref, name).map(c => {
    const o = Object.assign({ id: uid() }, c);
    if (have.has((o.date || '') + '|' + o.title)) { o.checked = false; o.warn = '이미 저장된 할 일이에요.'; o.dupTask = true; }
    return o;

}
const allDrafts = () => [UI.draft, ...UI.fileDrafts].filter(d => (d.text && d.text.trim()) || d.cands.length);

function findCand(id) {

}

    if (!t || !t.trim()) {
      if (navigator.clipboard.read) { try { for (const it of await navigator.clipboard.read()) { const ty = it.types.find(x => /^image\//.test(x)); if (ty) { handleFiles([namedImage(await it.getType(ty), '캡처 이미지')]); return; } } } catch (e2) { } }

    ta.value = t; UI.draft.text = t; UI.justSaved = 0; organizePaste(true);

    if (auto) toast(`복사해 둔 글 ${n}줄을 붙여넣었어요.`, null, '직접 쓸게요', () => { ta.value = ''; UI.draft.text = ''; organizePaste(true); ta.focus(); });

  if (sel.some(c => !c.title.trim())) { toast('내용이 빈 할 일이 있어요. 내용을 넣어 주세요.'); return; }
  const snap = JSON.stringify({ draft: UI.draft, fileDrafts: UI.fileDrafts });
  startBatch(); const now = nowIso(); const newSrc = [];
  for (const d of drafts) {
    const chosen = d.cands.filter(c => c.checked);
    if (!chosen.length && !(d.text || '').trim()) continue;

    if ((d.text || '').trim()) {
      const h = hashText(d.text.trim());

/* 후보 저장 */
function saveCandidates() {
  const sel = S.pending.filter(c => c.checked);

}

/* ---------- 백업 ---------- */
async function saveFile(name, text) {
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data: text }); return true; }
      catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast('잠시 뒤에 다시 눌러 주세요.'); return false; } }
    }
    return copyFallback(text);
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000); return true;
  } catch (e) { return copyFallback(text); }
}
function copyFallback(text) {
  return new Promise(res => {
    openModal({
      title: '백업 내용 복사하기', ok: '복사했어요',
      body: `<div class="mb">이 화면에서는 파일을 바로 내려받을 수 없어요. 아래 내용을 모두 복사해서 메모장에 붙여넣고 <b>.json</b> 파일로 저장해 두세요.</div><textarea class="inp" id="cpTxt" readonly style="min-height:160px;margin-top:10px;font-size:12px">${esc(text)}</textarea><button class="btn line sm" style="margin-top:8px" data-m="copy">📋 전체 복사</button>`,
      onExtra: async (act, box) => { if (act === 'copy') { const ta = $('#cpTxt', box); ta.select(); try { await navigator.clipboard.writeText(text); toast('복사했어요.'); } catch (e) { try { document.execCommand('copy'); toast('복사했어요.'); } catch (e2) { toast('Ctrl+C로 복사해 주세요.'); } } } },
      onOk: () => res(true), onCancel: () => res(false)
    });
  });
}
async function exportBackup() {
  const at = nowIso();
  const data = { app: '차곡', version: APP_VERSION, format: 1, exportedAt: at, sources: S.sources, tasks: S.tasks, pending: S.pending, settings: S.settings, school: S.school, memos: S.memos };
  await seatLoad(); if (SEAT.timer) await seatFlush();
  if (SEAT.raw) data.seats = SEAT.raw;
  const imgIds = [...usedImageIds()];
  if (imgIds.length) { data.images = {}; for (const id of imgIds) { const b = await ImgStore.get(id); if (b) data.images[id] = await blobToDataURL(b); } }
  const d = new Date();
  const name = `차곡_백업_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  const ok = await saveFile(name, JSON.stringify(data));
  if (!ok) return false;
  S.sources.forEach(s => { s.backedUpAt = at; });
  S.settings.lastBackupAt = at; commit();
  toast('백업 파일을 저장했어요. 다운로드 폴더를 확인하세요.');
  return true;
}
async function importBackup(file) {

  if (imgN) { try { const have = new Set(await ImgStore.keys()); for (const [id, u] of Object.entries(data.images)) if (!have.has(id)) await ImgStore.put(await dataURLToBlob(u), id); } catch (e) { toast('사진 일부를 불러오지 못했어요.'); } }
  openModal({

    body: `<div class="mb">${data.exportedAt ? fmtDateTime(data.exportedAt) + '에 만든 ' : ''}백업이에요. 자료 ${data.sources.length}개 · 할 일 ${data.tasks.length}개${imgN ? ` · 사진 ${imgN}장` : ''}${typeof data.seats === 'string' && seatSummary(data.seats) ? ` · 자리 배치(${esc(seatSummary(data.seats))})` : ''}</div>

    onOk: (box) => {

        S.settings.theme = (data.settings && data.settings.theme) || theme;
        if (typeof data.seats === 'string') seatReplace(data.seats);
      } else {
        if (typeof data.seats === 'string') seatLoad().then(() => { if (!SEAT.raw) seatReplace(data.seats); });
        const ids = { s: new Set(S.sources.map(x => x.id)), t: new Set(S.tasks.map(x => x.id)), p: new Set(S.pending.map(x => x.id)) };
        data.sources.forEach(x => { if (!ids.s.has(x.id)) S.sources.push(x); });
        data.tasks.forEach(x => { if (!ids.t.has(x.id)) S.tasks.push(x); });
        (data.pending || []).forEach(x => { if (!ids.p.has(x.id)) S.pending.push(x); });
        const mids = new Set(S.memos.map(x => x.id)); (data.memos || []).forEach(x => { if (!mids.has(x.id)) S.memos.push(x); });
        if (data.school && data.school.groups) { const filled = (sc) => sc && sc.groups && sc.groups.some(g => g.fields.some(f => (f.value || '').trim())); if (!filled(S.school)) S.school = data.school; }
        if (data.settings && data.settings.lastBackupAt && (!S.settings.lastBackupAt || data.settings.lastBackupAt > S.settings.lastBackupAt)) S.settings.lastBackupAt = data.settings.lastBackupAt;
      }
      commit(); toast('백업을 불러왔어요.');
    }
  });
}

  const delTasks = S.tasks.filter(t => ids.has(t.sourceId) && (t.updatedAt || t.createdAt || '') <= (S.sources.find(s => s.id === t.sourceId) || {}).backedUpAt);
  const keptChanged = S.tasks.filter(t => ids.has(t.sourceId)).length - delTasks.length;
  openModal({
    title: '① 백업한 자료 지우기', ok: '지우기', danger: true,
    body: `<div class="mb">백업 파일에 들어간 자료 <b>${backed.length}개</b>를 정리해요. 백업 파일을 불러오면 다시 돌아와요.</div>
      <label class="radio"><input type="radio" name="cb" value="text" checked><div><b>원문만 지우기</b> <span class="tag ok">추천</span><div class="muted small">자료 목록과 할 일은 남기고, 용량을 많이 쓰는 본문 글자만 지워요.</div></div></label>
      <label class="radio"><input type="radio" name="cb" value="all"><div><b>원문 + 그 자료에서 나온 할 일까지 지우기</b><div class="muted small">자료 ${backed.length}개와 할 일 ${delTasks.length}개를 지워요.${keptChanged > 0 ? ` 백업 뒤에 고친 할 일 ${keptChanged}개는 남겨요.` : ''}</div></div></label>`,
    onOk: (box) => {
      const mode = box.querySelector('input[name=cb]:checked').value;
      if (mode === 'text') { let n = 0; backed.forEach(s => { if (s.text) { s.text = ''; s.textClearedAt = nowIso(); n++; } }); commit(); toast(`자료 ${n}개의 원문을 지웠어요.`); }
      else {

        commit(); toast(`자료 ${backed.length}개와 할 일 ${dt.size}개를 지웠어요.`);
      }
    }
  });
}
